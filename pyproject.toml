[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cave-mem-v3"
version = "0.3.0"
description = "Replay-backed source failure memories for CAVE-Mem, proposal section 3.1"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cave3 = "cave_mem_v3.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
